<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TBS - Tum Bi Sikho</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: var(--bg-light); display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="login-container" style="background: var(--white); width: 100%; max-width: 450px; padding: 48px; border-radius: 30px; box-shadow: var(--shadow-md); text-align: center;">
        <div class="logo" style="justify-content: center; margin-bottom: 32px;">
            <img src="logo.png" alt="TBS Logo" style="height: 60px;">
        </div>
        <h1 style="font-size: 28px; margin-bottom: 8px;">Welcome Back</h1>
        <p style="color: var(--text-muted); margin-bottom: 32px;">Login to access your learning dashboard.</p>
        
        <form style="text-align: left;">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px;">Email Address</label>
                <input type="email" placeholder="name@example.com" style="width: 100%; padding: 14px 20px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; transition: var(--transition);" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='#e2e8f0'">
            </div>
            <div style="margin-bottom: 12px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px;">Password</label>
                <input type="password" placeholder="••••••••" style="width: 100%; padding: 14px 20px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; transition: var(--transition);" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='#e2e8f0'">
            </div>
            <div style="text-align: right; margin-bottom: 32px;">
                <a href="#" style="font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 600;">Forgot Password?</a>
            </div>
            <button type="submit" class="primary-btn" style="width: 100%; justify-content: center;">Login <i class="fa-solid fa-arrow-right"></i></button>
        </form>
        
        <div style="margin-top: 32px; font-size: 14px; color: var(--text-muted);">
            Don't have an account? <a href="signup.html" style="color: var(--accent); text-decoration: none; font-weight: 700;">Sign Up</a>
        </div>
        <div style="margin-top: 24px;">
            <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 13px;"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>
</body>
</html>
