<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | TBS - Tum Bi Sikho</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: var(--bg-light); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 0;">
    <div class="login-container" style="background: var(--white); width: 100%; max-width: 500px; padding: 48px; border-radius: 30px; box-shadow: var(--shadow-md); text-align: center;">
        <div class="logo" style="justify-content: center; margin-bottom: 32px;">
            <img src="logo.png" alt="TBS Logo" style="height: 60px;">
        </div>
        <h1 style="font-size: 28px; margin-bottom: 8px;">Create Account</h1>
        <p style="color: var(--text-muted); margin-bottom: 32px;">Join 50K+ students and start learning for free.</p>
        
        <form style="text-align: left;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px;">First Name</label>
                    <input type="text" placeholder="John" style="width: 100%; padding: 14px 20px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; transition: var(--transition);">
                </div>
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px;">Last Name</label>
                    <input type="text" placeholder="Doe" style="width: 100%; padding: 14px 20px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; transition: var(--transition);">
                </div>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px;">Email Address</label>
                <input type="email" placeholder="name@example.com" style="width: 100%; padding: 14px 20px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; transition: var(--transition);">
            </div>
            <div style="margin-bottom: 32px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px;">Password</label>
                <input type="password" placeholder="Min. 8 characters" style="width: 100%; padding: 14px 20px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; transition: var(--transition);">
            </div>
            <button type="submit" class="primary-btn" style="width: 100%; justify-content: center;">Get Started <i class="fa-solid fa-rocket"></i></button>
        </form>
        
        <div style="margin-top: 32px; font-size: 14px; color: var(--text-muted);">
            Already have an account? <a href="login.html" style="color: var(--accent); text-decoration: none; font-weight: 700;">Login</a>
        </div>
        <p style="margin-top: 24px; font-size: 12px; color: var(--text-muted); line-height: 1.6;">
            By signing up, you agree to our <a href="#" style="color: var(--primary);">Terms of Service</a> and <a href="#" style="color: var(--primary);">Privacy Policy</a>.
        </p>
    </div>
</body>
</html>
